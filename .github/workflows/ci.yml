name: ci
# Skip when a change touches only static docs. A change that also touches code runs everything.
on:
  push:
    branches: [master]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - run: bash test/lint.sh
      - run: npm i --no-save typescript@5.9.3 @types/node@22 && npm run typecheck

  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix: { node: [22, 24, 26] }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "${{ matrix.node }}" }
      - run: npm test

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: bash test/shell/run.sh

  # macOS ships bash 3.2 as /bin/bash; the controller must work there.
  bash32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          docker run --rm -v "$PWD":/src:ro bash:3.2 bash -c '
            apk add -q --no-cache openssh-client jq coreutils openssl nodejs perl git procps-ng >/dev/null
            cp -r /src /w && cd /w && bash test/shell/run.sh'

  # The macOS jobs are the slowest, so they run only what macOS can break: BSD userland and the
  # darwin code paths. bash 3.2 is covered in full by bash32. The macOS suites run as separate jobs so
  # they overlap.
  macos-shell:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: /bin/bash --version | head -1
      # common/ only: linux/ is Linux-only code, logic/ runs the same on any OS (test/shell/run.sh)
      - run: BASH_UNDER_TEST=/bin/bash /bin/bash test/shell/run.sh common

  macos-node:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      # jobs.test.mjs tests the job runner that runs in (Linux) VMs; MCP vm_jobs is in mcp.test.mjs.
      - run: node --test $(ls test/*.test.mjs | grep -v '/jobs\.test\.mjs$')
